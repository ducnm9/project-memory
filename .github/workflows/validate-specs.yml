name: Validate Specs

on:
  push:
    paths: ["specs/**", ".github/workflows/validate-specs.yml"]
  pull_request:
    paths: ["specs/**", ".github/workflows/validate-specs.yml"]

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("specs").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
